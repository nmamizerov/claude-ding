<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claude-ding demo</title>
<style>
  html, body { margin: 0; background: #0e0e12; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Deterministic motion piece: render(t) draws the frame at time t (seconds).
// Captured frame by frame by render.mjs; open this file in a browser to preview (it loops).
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const WAVES = window.WAVES || {};

const INTRO = 2.4, SCENE = 2.8, AUD = 0.3;
const SCENES = [
  { id: 'money',    color: '#4ade80', meaning: 'cash counter — money is charging' },
  { id: 'battle',   color: '#93c5fd', meaning: 'sword out of the sheath — ready to fight' },
  { id: 'mic-drop', color: '#c084fc', meaning: 'mic drop — nothing more to say' },
  { id: 'ship-it',  color: '#fb923c', meaning: 'rocket launch — shipped' },
  { id: 'zen',      color: '#5eead4', meaning: 'singing bowl — calm, no rush' },
];
const OUTRO_START = INTRO + SCENE * SCENES.length;
const TOTAL = OUTRO_START + 3.2;
window.TOTAL = TOTAL;
window.SOUND_TIMES = SCENES.map((s, i) => ({ id: s.id, t: INTRO + i * SCENE + AUD }));

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 3);
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const MONO = '"DejaVu Sans Mono", Menlo, monospace';
const SANS = 'Inter, "Inter Display", system-ui, sans-serif';

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, a));
  g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function text(s, x, y, font, color, align = 'left', a = 1) {
  ctx.globalAlpha = a;
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
  ctx.globalAlpha = 1;
}

function background() {
  ctx.fillStyle = '#0e0e12';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.45, 760);
  g.addColorStop(0, '#191922');
  g.addColorStop(1, '#0e0e12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---------- intro: Claude finishes a task ----------
function terminal(x, y, w, h, t, a) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  rr(x, y, w, h, 16); ctx.fillStyle = '#1c1c23'; ctx.fill();
  ctx.shadowColor = 'transparent';
  rr(x, y, w, 40, 16); ctx.fillStyle = '#26262f'; ctx.fill();
  ctx.fillRect(x, y + 24, w, 16);
  ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((c, i) => {
    ctx.beginPath(); ctx.arc(x + 24 + i * 22, y + 20, 7, 0, 7); ctx.fillStyle = c; ctx.fill();
  });
  ctx.globalAlpha = a;
  text('claude', x + w / 2, y + 20, `16px ${MONO}`, '#7c7c8a', 'center', a);
  const lx = x + 32, ly = y + 82;
  text('>', lx, ly, `bold 20px ${MONO}`, '#d97757', 'left', a);
  text('refactor the auth module', lx + 26, ly, `20px ${MONO}`, '#e4e4ea', 'left', a);
  if (t < 1.4) {
    const sp = '·✢✳✶✻✽'[Math.floor(t * 10) % 6];
    text(sp, lx, ly + 50, `bold 20px ${MONO}`, '#d97757', 'left', a);
    text('Working' + '.'.repeat(1 + Math.floor(t * 3) % 3), lx + 26, ly + 50, `20px ${MONO}`, '#d97757', 'left', a);
    text(`${Math.floor(t * 30)}s · esc to interrupt`, lx + 26, ly + 84, `18px ${MONO}`, '#6b6b78', 'left', a);
  } else {
    const k = easeOut((t - 1.4) / 0.3);
    text('●', lx, ly + 50, `bold 20px ${MONO}`, '#6ec882', 'left', a * k);
    text('Done. Updated 4 files.', lx + 26, ly + 50, `20px ${MONO}`, '#e4e4ea', 'left', a * k);
  }
  ctx.restore();
}

function intro(t) {
  const out = clamp((t - (INTRO - 0.35)) / 0.35);
  const s = 1 - 0.06 * easeIn(out);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  terminal(W / 2 - 380, H / 2 - 150, 760, 250, t, 1 - out);
  const k = easeOut((t - 1.6) / 0.4);
  text('…and you hear it.', W / 2, H / 2 + 160, `500 28px ${SANS}`, '#a1a1ad', 'center', k * (1 - out));
  ctx.restore();
}

// ---------- scene chrome: labels + waveform ----------
function chrome(i, lt, a) {
  const s = SCENES[i];
  // top bar
  ctx.globalAlpha = a;
  rr(40, 34, 214, 40, 20); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
  ctx.beginPath(); ctx.arc(64, 54, 6, 0, 7); ctx.fillStyle = '#6ec882'; ctx.fill();
  text('Claude is done', 80, 55, `500 18px ${SANS}`, '#c9c9d3', 'left', a);
  text(`${i + 1} / ${SCENES.length}`, W - 48, 55, `500 18px ${SANS}`, '#6b6b78', 'right', a);
  // dots progress
  SCENES.forEach((sc, j) => {
    ctx.beginPath(); ctx.arc(W / 2 - 48 + j * 24, 55, j === i ? 6 : 4, 0, 7);
    ctx.fillStyle = j === i ? sc.color : 'rgba(255,255,255,.18)';
    ctx.globalAlpha = a; ctx.fill();
  });
  // title + meaning
  const k = easeOut(lt / 0.5);
  text(s.id, W / 2, 566 + (1 - k) * 14, `700 48px ${SANS}`, s.color, 'center', a * k);
  text(s.meaning, W / 2, 610 + (1 - k) * 14, `400 22px ${SANS}`, '#a1a1ad', 'center', a * k);
  // waveform
  const wv = WAVES[s.id];
  if (wv) {
    const n = wv.peaks.length, bw = 6, gap = 3, total = n * (bw + gap) - gap;
    const x0 = W / 2 - total / 2, y = 662;
    const prog = clamp((lt - AUD) / wv.dur);
    for (let j = 0; j < n; j++) {
      const h = 4 + wv.peaks[j] * 26;
      ctx.globalAlpha = a;
      ctx.fillStyle = j / n < prog ? s.color : 'rgba(255,255,255,.14)';
      rr(x0 + j * (bw + gap), y - h / 2, bw, h, 3); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- 1. money ----------
function bill(x, y, w, h, rot, flip, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, flip);
  ctx.globalAlpha = a;
  rr(-w / 2, -h / 2, w, h, 8);
  const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  g.addColorStop(0, '#3fae6a'); g.addColorStop(1, '#2a8a52');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(200,255,215,.55)'; ctx.lineWidth = 2;
  rr(-w / 2 + 6, -h / 2 + 6, w - 12, h - 12, 5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, h * 0.28, 0, 7); ctx.fillStyle = 'rgba(220,255,230,.25)'; ctx.fill();
  ctx.fillStyle = '#eafff0'; ctx.font = `700 ${h * 0.42}px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 2);
  ctx.restore();
}
function money(lt, a) {
  const L = { x: 470, y: 380 }, R = { x: 810, y: 380 };
  const start = AUD, rate = 13, dur = 1.9;
  const count = Math.floor(clamp((lt - start) / dur) * rate * dur);
  glow(R.x, R.y - 40, 260, '#4ade80', 0.12 * a + 0.1 * a * clamp(count / 20));
  // right pile grows
  const landed = [];
  for (let j = 0; j < count; j++) if (lt - (start + j / rate) > 0.45) landed.push(j);
  for (let j = 0; j < Math.min(landed.length, 18); j++)
    bill(R.x + (rnd(j) - .5) * 14, R.y - j * 5, 170, 80, (rnd(j + 9) - .5) * 0.12, 1, a);
  // left stack shrinks
  const left = Math.max(4, 22 - count);
  for (let j = 0; j < left; j++) bill(L.x, L.y - j * 5, 170, 80, 0, 1, a);
  // flying bills
  for (let j = 0; j < 40; j++) {
    const tj = lt - (start + j / rate);
    if (tj < 0 || tj > 0.45 || start + j / rate > start + dur) continue;
    const k = easeInOut(tj / 0.45);
    const x = lerp(L.x, R.x, k);
    const y = lerp(L.y - left * 5, R.y - landed.length * 5, k) - Math.sin(k * Math.PI) * (150 + rnd(j) * 60);
    bill(x, y, 170, 80, (k - .5) * 0.9 * (rnd(j + 3) > .5 ? 1 : -1), Math.cos(k * Math.PI * 2), a);
  }
  // sparkles
  for (let j = 0; j < 14; j++) {
    const ph = (lt * 0.9 + rnd(j)) % 1;
    if (lt < start + 0.4) continue;
    const x = R.x + (rnd(j + 20) - .5) * 300, y = R.y - 60 - ph * 160;
    ctx.globalAlpha = a * Math.sin(ph * Math.PI);
    ctx.fillStyle = '#facc15';
    star(x, y, 3 + rnd(j + 40) * 4);
  }
  ctx.globalAlpha = 1;
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const rr2 = i % 2 ? r * 0.35 : r, an = i * Math.PI / 4;
    ctx.lineTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2);
  }
  ctx.closePath(); ctx.fill();
}

// ---------- 2. battle ----------
function battle(lt, a) {
  const y = 330, mouth = 700, sheathEnd = 1080;
  const k = easeOut((lt - AUD) / 0.35);
  const guard = lerp(mouth, 260, k);
  const bladeLen = 420;
  const lift = easeInOut((lt - 0.9) / 0.6);
  const sheathA = a * (1 - easeOut((lt - 0.85) / 0.4));
  glow(lerp(mouth, 500, k), y, 380, '#93c5fd', 0.10 * a + 0.12 * a * Math.exp(-Math.max(0, lt - AUD - 0.2) * 3) * (lt > AUD ? 1 : 0));

  // sheath
  ctx.globalAlpha = sheathA;
  rr(mouth, y - 20, sheathEnd - mouth, 40, 18);
  const sg = ctx.createLinearGradient(0, y - 20, 0, y + 20);
  sg.addColorStop(0, '#5b3a29'); sg.addColorStop(1, '#3a2418');
  ctx.fillStyle = sg; ctx.fill();
  ctx.fillStyle = '#d4a94f'; rr(mouth, y - 22, 14, 44, 4); ctx.fill(); rr(sheathEnd - 70, y - 21, 10, 42, 3); ctx.fill();

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(lift * 190, -lift * 30);
  const cxp = guard, tilt = -lift * 0.08;
  ctx.translate(cxp, y); ctx.rotate(tilt); ctx.translate(-cxp, -y);
  // blade (only the part outside the sheath while it's there)
  ctx.save();
  if (sheathA > 0.01) { ctx.beginPath(); ctx.rect(0, 0, mouth, H); ctx.clip(); }
  const bx = guard + 12, tip = bx + bladeLen;
  ctx.beginPath();
  ctx.moveTo(bx, y - 13); ctx.lineTo(tip - 40, y - 13); ctx.lineTo(tip, y); ctx.lineTo(tip - 40, y + 13); ctx.lineTo(bx, y + 13);
  ctx.closePath();
  const bg = ctx.createLinearGradient(0, y - 13, 0, y + 13);
  bg.addColorStop(0, '#f1f5f9'); bg.addColorStop(0.5, '#94a3b8'); bg.addColorStop(1, '#e2e8f0');
  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(bx + 10, y); ctx.lineTo(tip - 50, y); ctx.stroke();
  // glint
  const gk = (lt - 1.15) / 0.5;
  if (gk > 0 && gk < 1) {
    const gx = lerp(bx, tip, gk);
    const gg = ctx.createLinearGradient(gx - 60, 0, gx + 60, 0);
    gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(.5, 'rgba(255,255,255,.95)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(bx, y - 13); ctx.lineTo(tip - 40, y - 13); ctx.lineTo(tip, y); ctx.lineTo(tip - 40, y + 13); ctx.lineTo(bx, y + 13);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  if (gk >= 0.85 && gk < 1.6) {
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = a * Math.sin(clamp((gk - 0.85) / 0.75) * Math.PI);
    star(guard + 12 + bladeLen, y, 26);
    ctx.globalAlpha = a;
  }
  // guard, grip, pommel
  ctx.fillStyle = '#d4a94f';
  rr(guard - 4, y - 46, 16, 92, 6); ctx.fill();
  const gr = ctx.createLinearGradient(0, y - 11, 0, y + 11);
  gr.addColorStop(0, '#4b2e1f'); gr.addColorStop(1, '#2b1a10');
  ctx.fillStyle = gr; rr(guard - 110, y - 11, 106, 22, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(212,169,79,.5)'; ctx.lineWidth = 2;
  for (let j = 1; j < 6; j++) { ctx.beginPath(); ctx.moveTo(guard - 110 + j * 18, y - 10); ctx.lineTo(guard - 100 + j * 18, y + 10); ctx.stroke(); }
  ctx.fillStyle = '#d4a94f'; ctx.beginPath(); ctx.arc(guard - 120, y, 16, 0, 7); ctx.fill();
  ctx.restore();
  // speed lines while drawing
  const sk = (lt - AUD) / 0.35;
  if (sk > 0 && sk < 1.3) {
    ctx.strokeStyle = 'rgba(147,197,253,.5)'; ctx.lineWidth = 3;
    for (let j = 0; j < 5; j++) {
      const yy = y - 60 + j * 30, len = 120 * (1 - Math.abs(sk - 0.5));
      ctx.globalAlpha = a * clamp(1.3 - sk);
      ctx.beginPath(); ctx.moveTo(guard + 140 + rnd(j) * 120, yy); ctx.lineTo(guard + 140 + rnd(j) * 120 + len, yy); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- 3. mic drop ----------
function mic(x, y, rot, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
  // handle (centered on pivot)
  const hg = ctx.createLinearGradient(-14, 0, 14, 0);
  hg.addColorStop(0, '#2a2a33'); hg.addColorStop(.5, '#4a4a57'); hg.addColorStop(1, '#22222a');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.moveTo(-16, -20); ctx.lineTo(16, -20); ctx.lineTo(10, 110); ctx.lineTo(-10, 110); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c084fc'; rr(-17, -26, 34, 12, 4); ctx.fill();
  // head
  const g = ctx.createRadialGradient(-12, -70, 4, 0, -58, 42);
  g.addColorStop(0, '#e5e7eb'); g.addColorStop(1, '#6b7280');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -58, 38, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, -58, 38, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(40,40,50,.45)'; ctx.lineWidth = 2;
  for (let j = -40; j <= 40; j += 9) {
    ctx.beginPath(); ctx.moveTo(j - 40, -98); ctx.lineTo(j + 40, -18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(j + 40, -98); ctx.lineTo(j - 40, -18); ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}
function micdrop(lt, a) {
  const floor = 440, impact = AUD + 0.37, fall = 0.42;
  let x = 640, y, rot, shake = 0;
  const lying = Math.PI / 2 - 0.12;
  if (lt < impact - fall) { y = 130; rot = 0.05 * Math.sin(lt * 6); }
  else if (lt < impact) {
    const k = (lt - (impact - fall)) / fall;
    y = lerp(130, floor - 22, k * k); rot = lerp(0, lying * 0.85, easeIn(k));
  } else {
    const k = lt - impact;
    const b = Math.max(0, Math.sin(clamp(k / 0.22) * Math.PI)) * 28 * (k < 0.22 ? 1 : 0);
    y = floor - 22 - b; rot = lying + 0.1 * Math.exp(-k * 8) * Math.sin(k * 40);
    shake = Math.exp(-k * 14) * 10;
  }
  const sx = shake * Math.sin(lt * 90), sy = shake * Math.cos(lt * 70);
  ctx.save(); ctx.translate(sx, sy);
  // spotlight
  const sp = ctx.createRadialGradient(640, floor, 10, 640, floor, 340);
  sp.addColorStop(0, hexA('#c084fc', 0.16 * a)); sp.addColorStop(1, hexA('#c084fc', 0));
  ctx.fillStyle = sp; ctx.beginPath(); ctx.ellipse(640, floor, 340, 70, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${0.12 * a})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(320, floor); ctx.lineTo(960, floor); ctx.stroke();
  // shockwaves
  for (let j = 0; j < 3; j++) {
    const k = (lt - impact - j * 0.08) / 0.7;
    if (k <= 0 || k >= 1) continue;
    ctx.strokeStyle = hexA('#c084fc', a * (1 - k)); ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.ellipse(640, floor, 40 + k * 340, 8 + k * 50, 0, 0, 7); ctx.stroke();
  }
  // dust
  for (let j = 0; j < 18; j++) {
    const k = (lt - impact) / 0.8;
    if (k <= 0 || k >= 1) continue;
    const dir = rnd(j) > .5 ? 1 : -1, sp2 = 120 + rnd(j + 5) * 260;
    const px = 640 + dir * sp2 * easeOut(k), py = floor - (60 + rnd(j + 9) * 80) * Math.sin(k * Math.PI) * 0.8;
    ctx.globalAlpha = a * (1 - k); ctx.fillStyle = '#d8b4fe';
    ctx.beginPath(); ctx.arc(px, py, 2 + rnd(j + 2) * 4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // shadow
  const sh = clamp((y - 130) / (floor - 152));
  ctx.fillStyle = `rgba(0,0,0,${0.35 * sh * a})`;
  ctx.beginPath(); ctx.ellipse(640, floor + 4, 30 + 70 * sh, 8, 0, 0, 7); ctx.fill();
  mic(x, y, rot, a);
  ctx.restore();
}

// ---------- 4. ship it ----------
function rocket(x, y, a, flame) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a;
  if (flame > 0) {
    const fl = 60 + 40 * flame + 12 * Math.sin(performanceT * 60);
    const fg = ctx.createLinearGradient(0, 70, 0, 70 + fl);
    fg.addColorStop(0, '#fff7ed'); fg.addColorStop(.3, '#fdba74'); fg.addColorStop(1, 'rgba(251,146,60,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(-20, 66); ctx.quadraticCurveTo(0, 70 + fl * 1.1, 20, 66); ctx.closePath(); ctx.fill();
  }
  // fins
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.moveTo(-28, 20); ctx.lineTo(-56, 74); ctx.lineTo(-24, 64); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(28, 20); ctx.lineTo(56, 74); ctx.lineTo(24, 64); ctx.closePath(); ctx.fill();
  // body
  const bg = ctx.createLinearGradient(-30, 0, 30, 0);
  bg.addColorStop(0, '#cbd5e1'); bg.addColorStop(.45, '#ffffff'); bg.addColorStop(1, '#94a3b8');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(0, -100); ctx.bezierCurveTo(36, -60, 32, 20, 26, 68); ctx.lineTo(-26, 68); ctx.bezierCurveTo(-32, 20, -36, -60, 0, -100); ctx.fill();
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.moveTo(0, -100); ctx.bezierCurveTo(22, -76, 28, -60, 29, -52); ctx.lineTo(-29, -52); ctx.bezierCurveTo(-28, -60, -22, -76, 0, -100); ctx.fill();
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, -12, 15, 0, 7); ctx.fill();
  ctx.fillStyle = '#60a5fa'; ctx.beginPath(); ctx.arc(0, -12, 10, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(-3, -15, 3.5, 0, 7); ctx.fill();
  ctx.restore();
}
let performanceT = 0;
function shipit(lt, a) {
  const ign = AUD, lift = AUD + 0.35;
  const ly = lt > lift ? Math.pow(lt - lift, 2.2) * 620 : 0;
  const y = 330 - ly;
  const speed = lt > lift ? Math.pow(lt - lift, 1.2) * 1400 : 0;
  // stars
  for (let j = 0; j < 60; j++) {
    const sx = rnd(j) * W, base = rnd(j + 100) * H;
    const off = lt > lift ? Math.pow(lt - lift, 2.2) * 900 * (0.4 + rnd(j + 7)) : 0;
    const sy = (base + off) % H;
    const len = Math.min(70, speed * 0.02 * (0.4 + rnd(j + 7)));
    ctx.strokeStyle = `rgba(255,255,255,${(0.25 + rnd(j + 3) * 0.5) * a})`; ctx.lineWidth = 1.5 + rnd(j + 11);
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - len - 1.5); ctx.stroke();
  }
  // smoke
  for (let j = 0; j < 26; j++) {
    const te = ign + j * 0.06;
    if (lt < te) continue;
    const age = lt - te;
    const ey = te > lift ? 330 - Math.pow(te - lift, 2.2) * 620 : 330;
    const px = 640 + (rnd(j) - .5) * 40 + (rnd(j + 1) - .5) * age * 160;
    const py = Math.min(ey + 90 + age * 30, 470);
    const r = Math.min(16 + age * 60, 70);
    ctx.fillStyle = `rgba(200,200,215,${a * Math.max(0, 0.22 - age * 0.14)})`;
    ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
  }
  glow(640, y + 120, 220, '#fb923c', a * (lt > ign ? 0.3 : 0.08));
  const shake = lt > ign && lt < lift + 0.3 ? 3 * Math.sin(lt * 80) : 0;
  performanceT = lt;
  rocket(640 + shake, y, a, lt > ign ? clamp((lt - ign) / 0.3) : 0);
}

// ---------- 5. zen ----------
function zen(lt, a) {
  const cx = 640, cy = 400;
  const pulse = 0.5 + 0.5 * Math.sin(lt * 2.2);
  glow(cx, cy - 20, 360, '#5eead4', a * (0.08 + 0.07 * pulse) * (lt > AUD ? 1 : 0.5));
  // rings
  for (let j = 0; j < 6; j++) {
    const k = (lt - AUD - j * 0.38) / 2.2;
    if (k <= 0 || k >= 1) continue;
    ctx.strokeStyle = hexA('#5eead4', a * 0.7 * Math.sin(k * Math.PI) * (1 - k * 0.4));
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(cx, cy - 34, 120 + k * 420, 22 + k * 80, 0, 0, 7); ctx.stroke();
  }
  // floating motes
  for (let j = 0; j < 16; j++) {
    const ph = (lt * 0.25 + rnd(j)) % 1;
    ctx.fillStyle = hexA('#99f6e4', a * 0.6 * Math.sin(ph * Math.PI));
    ctx.beginPath(); ctx.arc(cx + (rnd(j + 30) - .5) * 520, cy - 40 - ph * 260, 1.5 + rnd(j + 50) * 2.5, 0, 7); ctx.fill();
  }
  // bowl
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy + 66, 130, 14, 0, 0, 7); ctx.fill();
  const bg = ctx.createLinearGradient(cx - 130, 0, cx + 130, 0);
  bg.addColorStop(0, '#7c5a22'); bg.addColorStop(.4, '#e2b857'); bg.addColorStop(.6, '#c99a3e'); bg.addColorStop(1, '#6b4c1c');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.moveTo(cx - 130, cy - 34); ctx.bezierCurveTo(cx - 126, cy + 50, cx - 60, cy + 66, cx, cy + 66);
  ctx.bezierCurveTo(cx + 60, cy + 66, cx + 126, cy + 50, cx + 130, cy - 34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#4a3512'; ctx.beginPath(); ctx.ellipse(cx, cy - 34, 130, 22, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#f2d27a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(cx, cy - 34, 130, 22, 0, 0, 7); ctx.stroke();
  // vibrating rim highlight
  const vib = lt > AUD ? Math.exp(-(lt - AUD) * 0.8) : 0;
  ctx.strokeStyle = hexA('#5eead4', a * 0.8 * vib); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy - 34, 134 + Math.sin(lt * 50) * 2 * vib, 25, 0, 0, 7); ctx.stroke();
  // mallet strike
  const mk = (lt - (AUD - 0.25)) / 0.25;
  if (mk < 1.6) {
    const m = mk < 1 ? easeIn(clamp(mk)) : 1 - easeOut((mk - 1) / 0.6) * 0.6;
    ctx.save(); ctx.translate(cx + 200 - 60 * m, cy - 120 + 70 * m); ctx.rotate(-0.7 + 0.3 * m);
    ctx.globalAlpha = a * (mk < 1 ? 1 : 1 - (mk - 1) / 0.6);
    ctx.fillStyle = '#8b5e34'; rr(-6, -10, 12, 120, 6); ctx.fill();
    ctx.fillStyle = '#e7d3b1'; rr(-12, -30, 24, 34, 10); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------- outro ----------
function outro(t) {
  const k = easeOut(t / 0.6);
  text('claude-ding', W / 2, 250 + (1 - k) * 20, `800 72px ${SANS}`, '#f4f4f6', 'center', k);
  text('a sound when Claude Code finishes', W / 2, 318 + (1 - k) * 20, `400 26px ${SANS}`, '#a1a1ad', 'center', k);
  SCENES.forEach((s, j) => {
    const kj = easeOut((t - 0.3 - j * 0.08) / 0.4);
    const x = W / 2 + (j - 2) * 150;
    ctx.globalAlpha = kj;
    ctx.beginPath(); ctx.arc(x, 392, 7, 0, 7); ctx.fillStyle = s.color; ctx.fill();
    text(s.id, x, 420, `600 18px ${SANS}`, s.color, 'center', kj);
  });
  const kc = easeOut((t - 0.8) / 0.5);
  ctx.globalAlpha = kc;
  rr(W / 2 - 430, 476, 860, 64, 14); ctx.fillStyle = '#1c1c23'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1.5; ctx.stroke();
  text('$', W / 2 - 400, 509, `bold 21px ${MONO}`, '#d97757', 'left', kc);
  text('curl -fsSL …/claude-ding/main/install.sh | bash', W / 2 - 372, 509, `21px ${MONO}`, '#e4e4ea', 'left', kc);
  text('github.com/nmamizerov/claude-ding', W / 2, 590, `500 20px ${SANS}`, '#6b6b78', 'center', kc);
  ctx.globalAlpha = 1;
}

const VIS = { 'money': money, 'battle': battle, 'mic-drop': micdrop, 'ship-it': shipit, 'zen': zen };

function render(t) {
  background();
  if (t < INTRO) { intro(t); return; }
  if (t >= OUTRO_START) { outro(t - OUTRO_START); return; }
  const i = Math.floor((t - INTRO) / SCENE), lt = t - INTRO - i * SCENE;
  const a = clamp(lt / 0.25) * clamp((SCENE - lt) / 0.25);
  VIS[SCENES[i].id](lt, a);
  chrome(i, lt, a);
}
window.render = render;

if (!window.CAPTURE) {
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
